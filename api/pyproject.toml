[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoapp-api"
version = "0.1.0"
description = "API for the drilling and exploration geology system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pyproj>=3.6",
    "anthropic>=2.0",
    "mcp>=2.0",
    "ezdxf>=1.3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
