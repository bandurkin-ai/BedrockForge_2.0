name: CI

on:
  push:
    branches: [base-functional, main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: geo, POSTGRES_PASSWORD: geo, POSTGRES_DB: geo_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U geo -d geo_test" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://geo:geo@localhost:5432/geo_test
    defaults: {run: {working-directory: api}}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: api/pyproject.toml}
      - run: pip install -e ".[dev]"
      - name: Tests (accuracy references included)
        run: python -m pytest -q
      # Speed and memory: budgets of bench/budgets.json, and no scenario more than 20 % (and at least 0.25 s) slower
      # than the base branch measured on the same runner.
      - name: Benchmarks of the base branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          if [ -f /tmp/base/api/bench/run.py ]; then
            (cd /tmp/base/api && pip install -q -e . && python -m bench.run --profile ci --repeat 3 --out /tmp/base.json) || true
            pip install -q -e .
          fi
      - name: Benchmarks
        run: python -m bench.run --profile ci --repeat 3 --check --baseline /tmp/base.json --out bench-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bench-ci, path: api/bench-ci.json, if-no-files-found: ignore}

  web:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p .
      - run: npm run build
