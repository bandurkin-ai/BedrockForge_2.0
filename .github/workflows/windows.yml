# Windows build and smoke E2E (ТЗ 10.4). Windows minutes cost x2, so it runs only on PRs that are
# ready for review (not drafts) and manually (workflow_dispatch); not on push to main (the merge
# commit was built in the PR); docs-only changes are skipped.
# Spikes Э0: (а) PyInstaller onedir with native deps computes; (г) start from a Cyrillic path with
# spaces and numba cache there; (б, в) the packaged app draws 1M triangles and the core answers.
name: windows
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  # makensis for tools/portable.nsi is taken from here (tools/ci/build_portable.ps1)
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.eb-cache

jobs:
  build:
    name: Сборка .exe и дымовой E2E
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: windows-latest
    # 60 → 80 (Э10): pytest ~23 min, builds ~15, the smoke E2E of all the specs on the .exe ~25 (series, perfEditor —
    # Э10); the last run was cut at 60 min inside the E2E. Billed by the time used, not by the limit.
    # 80 → 90 (Э14, ADR 0020 decision 25): PR #29 took 77:15 (pytest 27:34, smoke E2E 32:15); Э14 adds ≈ 1.5 min.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.6", enable-cache: true, cache-dependency-glob: core/uv.lock }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }

      - name: Ядро — зависимости
        working-directory: core
        run: uv sync --locked --group build
      - name: Ядро — pytest (подмножество windows)
        working-directory: core
        # two processes (Э10): in one, the memory of the runner ran out at the end of the subset (the process grew to
        # ~2 GB with the caches and the kernels of all the modules); every file runs once, nothing is left out
        shell: bash
        run: |
          set -e
          uv run pytest -q -m windows --tb=short --ignore-glob="tests/test_[m-z]*.py"
          uv run pytest -q -m windows --tb=short --ignore=tests/formats --ignore-glob="tests/test_[a-l]*.py"

      - name: Ядро — PyInstaller onedir
        working-directory: core
        run: uv run pyinstaller --noconfirm --clean bf-core.spec

      - name: Спайк а/г — самопроверка из пути с кириллицей и пробелами
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "Мои проекты\bf core"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force core\dist\bf-core $dst
          $env:NUMBA_CACHE_DIR = Join-Path $dst "кеш numba"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($i in 1, 2) {
            & (Join-Path $dst "bf-core\bf-core.exe") --selftest | Out-File -Encoding utf8 "artifacts\selftest-$i.json"
            if ($LASTEXITCODE -ne 0) { Get-Content "artifacts\selftest-$i.json"; throw "selftest $i failed" }
          }
          $r = Get-Content -Raw -Encoding utf8 artifacts\selftest-2.json | ConvertFrom-Json
          if (-not $r.frozen) { throw "not frozen" }
          if ($r.checks.numba.cache_files -lt 2) { throw "numba cache not written to $env:NUMBA_CACHE_DIR" }
          Write-Host "numba: first $((Get-Content -Raw artifacts\selftest-1.json | ConvertFrom-Json).checks.numba.seconds) s, cached $($r.checks.numba.seconds) s"
          $size = (Get-ChildItem -Recurse core\dist\bf-core | Measure-Object -Property Length -Sum).Sum / 1MB
          "bf-core onedir: {0:N0} MB" -f $size | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Интерфейс и оболочка
        run: |
          npm ci
          npm run build

      # ant (account login of the assistant, ADR 0029 decision 37): pinned in tools/ci/ant.json; without a pinned
      # url/sha256/licence the script warns, exits 0 and the build goes without ant (API key only, question 125)
      - name: ant — загрузка и проверка SHA-256
        continue-on-error: false
        run: python tools/ci/fetch_ant.py --platform windows

      - name: electron-builder (NSIS + win-unpacked)
        working-directory: app
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npx electron-builder --win nsis dir --x64 --publish never

      - name: Portable (tools/portable.nsi, однократная распаковка)
        shell: pwsh
        run: ./tools/ci/build_portable.ps1 -Check

      - name: Дымовой E2E на собранном приложении из пути с кириллицей
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "Программы BF\BedrockForge 2"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force app\release\win-unpacked\* $dst
          $env:BF_APP_EXE = Join-Path $dst "BedrockForge.exe"
          $env:BF_LOCAL_DIR = Join-Path $env:RUNNER_TEMP "Профиль Тест\BedrockForge"
          Set-Location app
          npx playwright test
          $rc = $LASTEXITCODE
          Copy-Item -Recurse -Force (Join-Path $env:BF_LOCAL_DIR "logs") ..\artifacts\logs -ErrorAction SilentlyContinue
          if ($rc -ne 0) { throw "E2E failed" }
          if (Test-Path ..\artifacts\startup.json) { "Запуск до рабочего окна: " + (Get-Content ..\artifacts\startup.json -Raw) | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }

      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          Set-Location app\release
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Get-ChildItem *.exe | ForEach-Object { "{0}: {1:N0} MB" -f $_.Name, ($_.Length / 1MB) } | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      # The .exe is not uploaded (saves Actions storage): the build and the smoke E2E are the check; size and
      # SHA-256 go to the run summary. Installers for people come from release.yml (workflow_dispatch).
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: windows-e2e, path: artifacts/, retention-days: 30, if-no-files-found: ignore }
