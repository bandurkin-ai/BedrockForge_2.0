# Tag v* -> full build and a draft GitHub Release with .exe and SHA256SUMS.txt (ТЗ 10.4, 16.5).
# Code signing, SBOM and latest.yml for auto-update are added on Э24.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: uv sync --frozen --group build
        working-directory: core
      - run: uv run pyinstaller --noconfirm --clean bf-core.spec
        working-directory: core
      - run: npm ci && npm run build
      - run: npx electron-builder --win portable nsis --x64 --publish never
        working-directory: app
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          Set-Location app\release
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Черновик выпуска
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" --draft --title "BedrockForge ${{ github.ref_name }}" --notes "Черновик выпуска. Отчёт вехи — в описании PR." app/release/*.exe app/release/SHA256SUMS.txt
