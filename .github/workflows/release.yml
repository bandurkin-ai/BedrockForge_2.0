# Tag v* -> full build and a draft GitHub Release with .exe and SHA256SUMS.txt (ТЗ 10.4, 16.5).
# Manual run on main with a version (workflow_dispatch): the workflow puts the tag on the commit it builds
# itself — for sessions whose git proxy refuses to push tags. Code signing, SBOM and latest.yml: Э24.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия выпуска, например v0.2.0 (тег ставится на последний коммит main)"
        required: true
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # makensis for tools/portable.nsi is taken from here (tools/ci/build_portable.ps1)
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.eb-cache

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Тег выпуска (ручной запуск)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if ("$env:TAG" -notmatch '^v\d+\.\d+\.\d+$') { throw "Версия выпуска — vX.Y.Z, получено: $env:TAG" }
          if ("${{ github.ref }}" -ne "refs/heads/main") { throw "Выпуск собирается только из main" }
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$env:TAG" -f sha="${{ github.sha }}"
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.6" }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: uv sync --locked --group build
        working-directory: core
      - run: uv run pyinstaller --noconfirm --clean bf-core.spec
        working-directory: core
      - run: npm ci && npm run build
      - run: npx electron-builder --win nsis dir --x64 --publish never
        working-directory: app
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Portable (tools/portable.nsi)
        shell: pwsh
        run: ./tools/ci/build_portable.ps1
      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          Set-Location app\release
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Черновик выпуска
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        # brand rules of every release (docs/brand/README.md «Выпуски»): the first line, the slogan, the icon
        run: |
          $notes = "**Bedrock**Forge by Mikhail Bandurkin — $env:TAG`n`n_Explore. Model. Plan. Mine._`n`nЧерновик выпуска. Состав — CHANGELOG.md, отчёт вехи — в описании PR этапа."
          Copy-Item docs\brand\app-icon-256.png app\release\app-icon-256.png
          gh release create "$env:TAG" --draft --title "BedrockForge $env:TAG" --notes $notes app/release/*.exe app/release/SHA256SUMS.txt app/release/app-icon-256.png
