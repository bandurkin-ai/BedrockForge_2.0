<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>BedrockForge by Mikhail Bandurkin</title>
  <style>
    :root { --bg: #15181d; --panel: #1b1f26; --fg: #dfe3ea; --muted: #8f98a8; --border: #2a303a; --brand: #e8873a; --err: #e06c75; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; user-select: none; }
    body { display: flex; flex-direction: column; border: 1px solid var(--border); -webkit-app-region: drag; }
    .top { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .mark { width: 56px; height: 56px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--brand) 0 50%, color-mix(in srgb, var(--brand) 55%, #000) 50% 100%); }
    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 0.01em; }
    .by { margin-top: 2px; color: var(--muted); font-size: 14px; }
    .status { min-height: 20px; color: var(--muted); }
    .status.err { color: var(--err); }
    .warn { color: var(--brand); }
    .bar { height: 3px; background: var(--panel); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 30%; background: var(--brand); animation: run 1.3s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    .unavailable { display: none; gap: 8px; align-items: center; -webkit-app-region: no-drag; }
    .unavailable.on { display: flex; }
    input { flex: 1; min-width: 0; padding: 5px 8px; color: var(--fg); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; font: inherit; }
    button { padding: 5px 12px; color: var(--fg); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--brand); }
    .foot { display: flex; justify-content: space-between; padding: 8px 14px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); }
    .close { position: absolute; top: 6px; right: 8px; padding: 0 8px; border: 0; background: none; color: var(--muted); font-size: 16px; -webkit-app-region: no-drag; }
  </style>
</head>
<body>
  <button class="close" id="close" title="Закрыть" aria-label="Закрыть">×</button>
  <div class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>BedrockForge</h1>
        <div class="by">by Mikhail Bandurkin</div>
      </div>
    </div>
    <div class="status" id="status">Запуск…</div>
    <div class="unavailable" id="unavailable">
      <input id="server" spellcheck="false" aria-label="Адрес сервера" />
      <button id="save">Подключить</button>
      <button id="retry">Повторить</button>
    </div>
  </div>
  <div class="bar" id="bar"><i></i></div>
  <div class="foot"><span>Геология и горное дело</span><span id="version"></span></div>
  <script src="splash.js"></script>
</body>
</html>
