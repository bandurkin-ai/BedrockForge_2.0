[project]
name = "bf-core"
version = "0.0.1"
description = "BedrockForge 2 compute core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.13",
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "duckdb>=1.1",
  "numba>=0.60",
  "manifold3d>=3.0",
  "pythoncdt>=1.0",
  "mapbox-earcut>=1.0",
  "pyfqmr>=0.2",
  "scikit-image>=0.24",
  "numexpr>=2.10",
  "threadpoolctl>=3.5",
  "openpyxl>=3.1",
  "pillow>=11",
  "zstandard>=0.23",
  "cryptography>=43",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-licenses>=5.0",
]
build = [
  "pyinstaller>=6.11",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "windows: tests that must also run on Windows CI",
  "db: database layer tests (SQLite and PostgreSQL)",
  "slow: long-running tests",
]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
