services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://geo:geo@db:5432/geo
      # Object store (geometry, images, uploads); shared with the worker through the volume.
      DATA_DIR: /data
      # Jobs run in the worker service, not in the API process.
      JOBS_IN_API: "0"
      # Claude assistant: take the key from the shell or a .env file next to this file.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5-5}
      # Hosts allowed to reach the MCP endpoint /mcp (add your public host when publishing it).
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,api:*}
    ports:
      - "8000:8000"
    volumes:
      - store:/data
    depends_on:
      db:
        condition: service_healthy

  # Background jobs (imports, calculations). Scale with `docker compose up --scale worker=3`.
  worker:
    build: ./api
    command: ["python", "-m", "app.jobs.worker"]
    environment: *api-env
    volumes:
      - store:/data
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_started

  # Operations on lines and wireframes (stitching, booleans, repair): seconds each; a worker of their
  # own, so they never wait behind the import of a big file.
  worker-quick:
    build: ./api
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      <<: *api-env
      JOB_KINDS: geometry.operation
    volumes:
      - store:/data
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_started

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Windows hosts send no file events into the container: poll, so a `git pull` reaches the browser.
      VITE_POLL: "1"
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  store:
